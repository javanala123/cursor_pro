<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 차트 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; padding: 20px; }
        .chart-container { width: 100%; height: 400px; background: #2a2a2a; border-radius: 10px; padding: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>간단한 차트 테스트</h1>
    <div class="chart-container">
        <canvas id="testChart"></canvas>
    </div>

    <script>
        // 간단한 데이터
        const testData = [];
        const now = new Date();
        let price = 50000;
        
        for (let i = 0; i < 50; i++) {
            const time = new Date(now.getTime() - (50 - i) * 60000);
            price += (Math.random() - 0.5) * 1000;
            testData.push({
                x: time.getTime(),
                y: price
            });
        }
        
        // 차트 생성
        const ctx = document.getElementById('testChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'BTC/USDT',
                    data: testData,
                    borderColor: '#4CAF50',
                    backgroundColor: 'rgba(76, 175, 80, 0.1)',
                    borderWidth: 2,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: 'minute'
                        }
                    },
                    y: {
                        position: 'right'
                    }
                }
            }
        });
        
        console.log('차트 생성 완료:', chart);
    </script>
</body>
</html>
