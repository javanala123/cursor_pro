<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최소 차트 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; padding: 20px; }
        .chart-container { width: 100%; height: 400px; background: #2a2a2a; border-radius: 10px; padding: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>최소 차트 테스트</h1>
    <div class="chart-container">
        <canvas id="testChart"></canvas>
    </div>

    <script>
        console.log('Chart.js 로드됨:', typeof Chart);
        
        // 가장 간단한 데이터
        const testData = [
            { x: 1, y: 50000 },
            { x: 2, y: 51000 },
            { x: 3, y: 49000 },
            { x: 4, y: 52000 },
            { x: 5, y: 48000 }
        ];
        
        try {
            const ctx = document.getElementById('testChart').getContext('2d');
            console.log('Canvas 컨텍스트:', ctx);
            
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: '테스트',
                        data: testData,
                        borderColor: '#4CAF50',
                        backgroundColor: 'rgba(76, 175, 80, 0.1)',
                        borderWidth: 2,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
            
            console.log('차트 생성 완료:', chart);
        } catch (error) {
            console.error('차트 생성 실패:', error);
        }
    </script>
</body>
</html>
