# 볼린저 밴드 전략 최적화 설정 파일

# 최적화 기본 설정
optimization:
  target: "total_return"        # 최적화 목표: total_return (수익률), win_rate (승률), sharpe_ratio (샤프비율)
  method: "grid_search"         # 최적화 방법: grid_search (그리드 서치), random_search (랜덤 서치)
  min_trades: 10                 # 최소 거래 횟수 (이보다 적으면 결과 제외)
  max_drawdown_limit: 50.0      # 최대 낙폭 제한 (%)
  
  # 백테스트 기본 기간
  default_start_date: "2023-01-01"
  default_end_date: "2024-12-31"
  
  # 최적화 파라미터 범위
  parameter_ranges:
    # 롱 볼린저 밴드
    long_bb_length:
      min: 10
      max: 30
      step: 2
    long_bb_dev:
      min: 1.5
      max: 3.0
      step: 0.2
    # 숏 볼린저 밴드
    short_bb_length:
      min: 10
      max: 30
      step: 2
    short_bb_dev:
      min: 1.5
      max: 3.0
      step: 0.2
    # 손절/익절
    long_tp_perc:
      min: 1.0
      max: 5.0
      step: 0.5
    long_sl_perc:
      min: 3.0
      max: 10.0
      step: 1.0
    short_tp_perc:
      min: 1.0
      max: 5.0
      step: 0.5
    short_sl_perc:
      min: 3.0
      max: 10.0
      step: 1.0

