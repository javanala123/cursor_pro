# MT5 설정
mt5:
  # Strategy Tester 설정
  tester:
    optimization_mode: "genetic"      # genetic (유전 알고리즘), complete (완전 탐색)
    forward_mode: false               # Forward testing 사용 여부
    forward_date: "2024-01-01"       # Forward testing 시작 날짜
  
  # 결과 저장 경로
  results_path: "results/"
  
  # 로그 설정
  log_level: "info"                   # debug, info, warning, error

# TradingView 설정 (향후 지원)
tradingview:
  enabled: false
  api_key: ""
  api_secret: ""

