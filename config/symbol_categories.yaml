# 카테고리별 최적화 우선순위
optimization_priority:
  - category: "futures"
    priority: 1
    symbols: ["ES", "NQ", "GC", "CL"]
  - category: "crypto"
    priority: 2
    symbols: ["BTCUSD", "ETHUSD"]
  - category: "forex"
    priority: 3
    symbols: ["EURUSD", "GBPUSD", "USDJPY"]

