      contract_value: 5.0
      lot_step: 0.1
      min_lot: 0.1
      point_value: 0.1
      typical_spread: 0.1
      volatility: "high"
  
  # 금속 선물
  metals:
    - symbol: "GC"
      mt5_symbol: "GC1!"
      name: "Gold"
      contract_value: 100.0
      lot_step: 0.1
      min_lot: 0.1
      point_value: 0.1
      typical_spread: 0.2
      volatility: "medium"
      
    - symbol: "SI"
      mt5_symbol: "SI1!"
      name: "Silver"
      contract_value: 5000.0
      lot_step: 0.1
      min_lot: 0.1
      point_value: 0.005
      typical_spread: 0.01
      volatility: "high"
      
    - symbol: "HG"
      mt5_symbol: "HG1!"
      name: "Copper"
      contract_value: 25000.0
      lot_step: 0.1
      min_lot: 0.1
      point_value: 0.0005
      typical_spread: 0.001
      volatility: "medium"
  
  # 에너지 선물
  energy:
    - symbol: "CL"
      mt5_symbol: "CL1!"
      name: "Crude Oil"
      contract_value: 1000.0
      lot_step: 0.1
      min_lot: 0.1
      point_value: 0.01
      typical_spread: 0.02
      volatility: "high"
      
    - symbol: "NG"
      mt5_symbol: "NG1!"
      name: "Natural Gas"
      contract_value: 10000.0
      lot_step: 0.1
      min_lot: 0.1
      point_value: 0.001
      typical_spread: 0.002
      volatility: "very_high"

