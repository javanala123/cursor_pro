# 심볼 카테고리 정의 파일
# 각 심볼의 특성과 최적화 설정을 정의

# 선물 카테고리
futures:
  # 지수 선물
  indices:
    - symbol: "ES"
      mt5_symbol: "ES1!"
      name: "E-mini S&P 500"
      contract_value: 5.0
      lot_step: 0.1
      min_lot: 0.1
      point_value: 0.25
      typical_spread: 0.25
      volatility: "medium"
      
    - symbol: "NQ"
      mt5_symbol: "NQ1!"
      name: "E-mini NASDAQ"
      contract_value: 2.0
      lot_step: 0.1
      min_lot: 0.1
      point_value: 0.25
      typical_spread: 0.5
      volatility: "high"
      
    - symbol: "YM"
      mt5_symbol: "YM1!"
      name: "E-mini Dow Jones"
      contract_value: 5.0
      lot_step: 0.1
      min_lot: 0.1
      point_value: 1.0
      typical_spread: 1.0
      volatility: "medium"
      
    - symbol: "RTY"
      mt5_symbol: "RTY1!"
